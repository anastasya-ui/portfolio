<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anastasia Konyuhova — Product Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --radius-card: 22px;
    --side: max(0px, calc((100vw - 1440px) / 2));
  }
  *, *::before, *::after { box-sizing: inherit; }

  html[data-theme="dark"] {
    --bg: #0A0A0B; --surface: #111113; --panel: #1B1B1D; --well: #17171A;
    --stroke: #27272B; --ink: #F4F4F2; --grey: #BABAC2;
    --sel-bg: #2C2C31; --sel-fg: #EDEDEB;
  }
  html[data-theme="light"] {
    --bg: #FFFFFF; --surface: #F5F5F7; --panel: #F5F5F7; --well: #EDEDF2;
    --stroke: #E8E8EF; --ink: #1D1D1F; --grey: #6E6E73;
    --sel-bg: #E8E8ED; --sel-fg: #1D1D1F;
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Onest', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background .25s ease, color .25s ease;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }

  /* ---------- shared controls ---------- */
  .cv-btn {
    display: inline-flex; align-items: center; min-height: 36px;
    padding: 0 16px; border-radius: 999px; border: 1px solid var(--stroke);
    background: transparent; color: var(--ink); font-size: 13px; white-space: nowrap;
  }
  .controls { display: flex; align-items: center; gap: 8px; }
  .seg {
    display: inline-flex; padding: 2px; border-radius: 999px;
    border: 1px solid var(--stroke); background: transparent;
  }
  .seg button {
    min-height: 32px; padding: 0 12px; border: 0; border-radius: 999px;
    cursor: pointer; font-size: 12px; background: transparent; color: var(--grey);
  }
  .seg button.active { background: var(--sel-bg); color: var(--sel-fg); }
  .theme-btn {
    width: 36px; height: 36px; display: inline-flex; align-items: center;
    justify-content: center; border-radius: 999px; border: 1px solid var(--stroke);
    background: transparent; color: var(--ink); cursor: pointer;
  }
  html[data-theme="dark"] .theme-btn .i-moon { display: none; }
  html[data-theme="light"] .theme-btn .i-sun { display: none; }

  /* ---------- layout ---------- */
  .sidebar {
    position: fixed; top: 0; left: var(--side); width: 400px; height: 100vh; height: 100dvh;
    box-sizing: border-box;
    padding: calc(28px + env(safe-area-inset-top, 0px)) 40px 22px 48px;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .identity { display: flex; align-items: center; gap: 18px; }
  .photo { width: 72px; height: 72px; border-radius: 999px; object-fit: cover; flex-shrink: 0; }
  .name { margin: 0; font-weight: 300; font-size: 20px; line-height: 1.15; letter-spacing: -0.02em; }
  .role-title { margin-top: 8px; font-size: 13px; color: var(--grey); }
  .bio { margin: 16px 0 0 0; font-size: 14.5px; line-height: 1.5; color: var(--grey); }

  .contacts { margin-top: 16px; display: flex; gap: 8px; }
  .icon-btn {
    width: 40px; height: 40px; display: inline-flex; align-items: center;
    justify-content: center; border-radius: 999px; border: 1px solid var(--stroke);
    background: transparent; color: var(--ink);
  }

  .xp-label { margin-top: 48px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--grey); }
  .xp-list { margin-top: 6px; display: flex; flex-direction: column; }
  .job {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--stroke);
  }
  .job .company { font-size: 16.5px; letter-spacing: -0.01em; }
  .job .role { margin-top: 2px; font-size: 13px; color: var(--grey); }
  .job .dates { text-align: right; font-size: 13px; color: var(--grey); line-height: 1.4; white-space: nowrap; padding-top: 3px; }

  .sidebar .cv-btn { margin-top: 24px; align-self: flex-start; }
  .controls-fixed { position: fixed; left: calc(48px + var(--side)); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); }

  .topbar { display: none; }

  /* ---------- feed ---------- */
  .feed {
    margin-left: calc(460px + var(--side)); box-sizing: border-box;
    padding: 26px calc(28px + var(--side)) 60px 0;
    display: flex; flex-direction: column; gap: 16px;
  }
  .card {
    display: flex; align-items: stretch; border-radius: var(--radius-card); overflow: hidden;
    background: var(--surface); min-height: 560px; color: var(--ink); max-width: 950px;
  }
  .card .cover {
    flex: 0 0 630px; display: flex; align-items: center; justify-content: center;
    background: var(--well);
  }
  .cover .ph { font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--grey); text-align: center; padding: 0 24px; }
  .cover--embed { padding: 0; position: relative; }
  .coverframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  .cover-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .card .text {
    width: 320px; flex-shrink: 0; box-sizing: border-box; padding: 30px;
    display: flex; flex-direction: column; background: var(--panel);
  }
  .card .title { margin: 0; font-weight: 300; font-size: 28px; line-height: 1.14; letter-spacing: -0.03em; }
  .card .desc { margin: 10px 0 0 0; font-size: 14.5px; line-height: 1.55; color: var(--grey); }
  .sep { margin: 18px 0 18px 0; height: 1px; background: var(--stroke); }
  .metrics { display: flex; flex-direction: column; gap: 22px; margin-bottom: 28px; }
  .metric .num { font-weight: 300; font-size: 28px; letter-spacing: -0.03em; }
  .metric .cap { margin-top: 6px; font-size: 14px; line-height: 1.45; color: var(--grey); }
  .read-case {
    margin-top: auto; align-self: flex-start; display: inline-flex; align-items: center; gap: 7px;
    min-height: 40px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--stroke);
    background: transparent; color: var(--grey); font-size: 13px;
    opacity: 0.55; cursor: not-allowed;
  }
  .read-case .rc-lock { flex-shrink: 0; }
  .nda {
    margin-top: auto; align-self: flex-start; display: inline-flex; align-items: center;
    min-height: 48px; padding: 0 24px; border-radius: 999px; border: 1px solid var(--stroke);
    color: var(--grey); font-size: 14.5px;
  }

  /* ---------- hover ---------- */
  .cv-btn, .icon-btn, .theme-btn, .seg button, .read-case {
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  @media (hover: hover) {
    .cv-btn:hover, .icon-btn:hover, .theme-btn:hover {
      background: var(--ink); color: var(--bg); border-color: var(--ink);
    }
    .seg button:not(.active):hover { background: var(--ink); color: var(--bg); }
  }

  /* ======= TABLET + MOBILE: vertical cards, image capped at native size ======= */
  @media (max-width: 1359px) {
    .card { flex-direction: column; align-items: stretch; min-height: 0; height: auto; max-width: 630px; }
    .card .cover { flex: none; width: 100%; height: auto; aspect-ratio: 630 / 560; }
    .card .text { width: auto; padding: 26px 24px; }
    .metrics { flex-direction: row; gap: 20px; margin-bottom: 0; }
    .metric { flex: 1; }
    .card .title { font-size: 26px; }
    .metric .num { font-size: 26px; }
    .read-case { display: none; }
    .nda { margin-top: 20px; min-height: 0; padding: 0; border: 0; }
  }

  /* ======= MOBILE only: profile on top ======= */
  @media (max-width: 800px) {
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: calc(14px + env(safe-area-inset-top, 0px)) 20px 12px 20px;
    }
    .topbar .cv-btn { min-height: 40px; }
    .topbar .theme-btn { width: 40px; height: 40px; }
    .topbar .seg button { min-height: 36px; }
    .sidebar {
      position: static; width: auto; height: auto; overflow: visible;
      padding: 16px 20px 0 20px; align-items: center; text-align: center;
    }
    .sidebar > .cv-btn, .controls-fixed { display: none; }
    .identity { flex-direction: column; gap: 0; }
    .photo { width: 140px; height: 140px; }
    .identity .idtext { margin-top: 28px; display: flex; flex-direction: column; align-items: center; }
    .role-title { order: -1; margin-top: 0; font-size: 13px; }
    .name { margin-top: 6px; font-size: 30px; }
    .bio { margin-top: 16px; max-width: 320px; }
    .contacts { margin-top: 24px; justify-content: center; gap: 10px; }
    .icon-btn { width: 44px; height: 44px; }
    .xp-label { margin-top: 32px; align-self: stretch; text-align: left; }
    .xp-list { align-self: stretch; text-align: left; }
    .feed { margin-left: 0; padding: 80px 20px calc(40px + env(safe-area-inset-bottom, 0px)) 20px; }
    .card { max-width: none; }
  }

  /* profile text block (tablet + desktop) */
  @media (min-width: 801px) {
    .identity .idtext { display: flex; flex-direction: column; }
  }
</style>

  function applyLang() {
    var dict = I18N[lang];

      var k = el.getAttribute('data-i18n');

  // --- one video on screen at a time: play only the most-visible cover ---
  (function () {
    var vids = Array.prototype.slice.call(document.querySelectorAll('.cover-video'));
    if (!vids.length) return;
    var reduce = false;
    try { reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    var ratio = {};
    vids.forEach(function (v, i) { v.__i = i; ratio[i] = 0; try { v.pause(); } catch (e) {} });
    var active = null;
    function playV(v) { try { var p = v.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
    function apply() {
      if (document.hidden || reduce) { vids.forEach(function (v) { v.pause(); }); active = null; return; }
      var best = null, bestR = 0;
      vids.forEach(function (v) { var r = ratio[v.__i] || 0; if (r > bestR) { bestR = r; best = v; } });
      if (active && best !== active) { var ar = ratio[active.__i] || 0; if (ar >= 0.35 && bestR <= ar + 0.08) best = active; }
      if (bestR < 0.35) best = null;
      vids.forEach(function (v) { if (v === best) playV(v); else v.pause(); });
      active = best;
    }
    try {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) { ratio[e.target.__i] = e.intersectionRatio; });
        apply();
      }, { threshold: [0, 0.2, 0.35, 0.5, 0.65, 0.8, 1] });
      vids.forEach(function (v) { io.observe(v); });
    } catch (e) { vids.forEach(playV); return; }
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) vids.forEach(function (v) { v.pause(); });
      else { active = null; apply(); }
    });
  })();

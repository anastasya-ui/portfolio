<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anastasia Konyuhova — Product Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --radius-card: 22px;
  }
  *, *::before, *::after { box-sizing: inherit; }

  html[data-theme="dark"] {
    --bg: #0A0A0B; --surface: #111113; --panel: #1B1B1D; --well: #17171A;
    --stroke: #27272B; --ink: #F4F4F2; --grey: #BABAC2;
    --sel-bg: #2C2C31; --sel-fg: #EDEDEB;
  }
  html[data-theme="light"] {
    --bg: #FFFFFF; --surface: #F5F5F7; --panel: #F5F5F7; --well: #EDEDF2;
    --stroke: #E8E8EF; --ink: #1D1D1F; --grey: #6E6E73;
    --sel-bg: #E8E8ED; --sel-fg: #1D1D1F;
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Onest', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background .25s ease, color .25s ease;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }

  /* ---------- shared controls ---------- */
  .cv-btn {
    display: inline-flex; align-items: center; min-height: 36px;
    padding: 0 16px; border-radius: 999px; border: 1px solid var(--stroke);
    background: transparent; color: var(--ink); font-size: 13px; white-space: nowrap;
  }
  .controls { display: flex; align-items: center; gap: 8px; }
  .seg {
    display: inline-flex; padding: 2px; border-radius: 999px;
    border: 1px solid var(--stroke); background: transparent;
  }
  .seg button {
    min-height: 32px; padding: 0 12px; border: 0; border-radius: 999px;
    cursor: pointer; font-size: 12px; background: transparent; color: var(--grey);
  }
  .seg button.active { background: var(--sel-bg); color: var(--sel-fg); }
  .theme-btn {
    width: 36px; height: 36px; display: inline-flex; align-items: center;
    justify-content: center; border-radius: 999px; border: 1px solid var(--stroke);
    background: transparent; color: var(--ink); cursor: pointer;
  }
  html[data-theme="dark"] .theme-btn .i-moon { display: none; }
  html[data-theme="light"] .theme-btn .i-sun { display: none; }

  /* ---------- layout ---------- */
  .sidebar {
    position: fixed; top: 0; left: 0; width: 400px; height: 100vh; height: 100dvh;
    box-sizing: border-box;
    padding: calc(28px + env(safe-area-inset-top, 0px)) 40px 22px 48px;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .identity { display: flex; align-items: center; gap: 18px; }
  .photo { width: 72px; height: 72px; border-radius: 999px; object-fit: cover; flex-shrink: 0; }
  .name { margin: 0; font-weight: 300; font-size: 20px; line-height: 1.15; letter-spacing: -0.02em; }
  .role-title { margin-top: 8px; font-size: 12px; color: var(--grey); }
  .bio { margin: 16px 0 0 0; font-size: 14.5px; line-height: 1.5; color: var(--grey); }

  .contacts { margin-top: 16px; display: flex; gap: 8px; }
  .icon-btn {
    width: 40px; height: 40px; display: inline-flex; align-items: center;
    justify-content: center; border-radius: 999px; border: 1px solid var(--stroke);
    background: transparent; color: var(--ink);
  }

  .xp-label { margin-top: 36px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--grey); }
  .xp-list { margin-top: 6px; display: flex; flex-direction: column; }
  .job {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--stroke);
  }
  .job .company { font-size: 16.5px; letter-spacing: -0.01em; }
  .job .role { margin-top: 2px; font-size: 12px; color: var(--grey); }
  .job .dates { text-align: right; font-size: 12px; color: var(--grey); line-height: 1.4; white-space: nowrap; padding-top: 3px; }

  .sidebar .cv-btn { margin-top: 18px; align-self: flex-start; }
  .controls-fixed { position: fixed; left: 48px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); }

  .topbar { display: none; }

  /* ---------- feed ---------- */
  .feed {
    margin-left: 460px; box-sizing: border-box;
    padding: 26px 28px 60px 0;
    display: flex; flex-direction: column; gap: 16px;
  }
  .card {
    display: flex; border-radius: var(--radius-card); overflow: hidden;
    background: var(--surface); min-height: 520px; color: var(--ink);
  }
  .card .cover {
    flex-grow: 1; display: flex; align-items: center; justify-content: center;
    background: var(--well); min-height: 320px;
  }
  .cover .ph { font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--grey); text-align: center; padding: 0 24px; }
  .cover--embed { padding: 0; }
  .coverframe { width: 100%; height: 100%; border: 0; display: block; }
  .card--tall { min-height: 560px; }
  .card .text {
    width: 320px; flex-shrink: 0; box-sizing: border-box; padding: 30px 40px;
    display: flex; flex-direction: column; background: var(--panel);
  }
  .card .title { margin: 0; font-weight: 300; font-size: 28px; line-height: 1.14; letter-spacing: -0.03em; }
  .card .desc { margin: 16px 0 0 0; font-size: 14.5px; line-height: 1.55; color: var(--grey); }
  .sep { margin: 26px 0 24px 0; height: 1px; background: var(--stroke); }
  .metrics { display: flex; flex-direction: column; gap: 28px; margin-bottom: 32px; }
  .metric .num { font-weight: 300; font-size: 28px; letter-spacing: -0.03em; }
  .metric .cap { margin-top: 6px; font-size: 13px; line-height: 1.45; color: var(--grey); }
  .read-case {
    margin-top: auto; align-self: flex-start; display: inline-flex; align-items: center;
    min-height: 40px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--stroke);
    background: transparent; color: var(--ink); font-size: 13px;
  }
  .nda {
    margin-top: auto; align-self: flex-start; display: inline-flex; align-items: center;
    min-height: 48px; padding: 0 24px; border-radius: 999px; border: 1px solid var(--stroke);
    color: var(--grey); font-size: 14.5px;
  }

  /* ---------- hover ---------- */
  .cv-btn, .icon-btn, .theme-btn, .seg button, .read-case {
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  @media (hover: hover) {
    .cv-btn:hover, .icon-btn:hover, .theme-btn:hover {
      background: var(--ink); color: var(--bg); border-color: var(--ink);
    }
    .seg button:not(.active):hover { background: var(--ink); color: var(--bg); }
  }

  /* ================= MOBILE ================= */
  @media (max-width: 820px) {
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      position: sticky; top: 0; z-index: 20; background: var(--bg);
      padding: calc(14px + env(safe-area-inset-top, 0px)) 20px 14px 20px;
    }
    .sidebar {
      position: static; width: auto; height: auto; overflow: visible;
      padding: 28px 20px 0 20px; align-items: center; text-align: center;
    }
    .sidebar > .cv-btn, .controls-fixed { display: none; }

    .identity { flex-direction: column; gap: 0; }
    .photo { width: 140px; height: 140px; }
    .identity .idtext { margin-top: 28px; display: flex; flex-direction: column; align-items: center; }
    .role-title { order: -1; margin-top: 0; font-size: 13px; }
    .name { margin-top: 6px; font-size: 30px; }
    .bio { margin-top: 16px; max-width: 320px; }

    .contacts { margin-top: 24px; justify-content: center; gap: 10px; }
    .icon-btn { width: 44px; height: 44px; }

    .xp-label { margin-top: 32px; align-self: stretch; text-align: left; }
    .xp-list { align-self: stretch; text-align: left; }

    .feed { margin-left: 0; padding: 80px 20px calc(40px + env(safe-area-inset-bottom, 0px)) 20px; }
    .card { flex-direction: column; min-height: 0; }
    .card .cover { min-height: 0; height: 300px; }
    .card--tall { min-height: 0; }
    .card .cover.cover--embed { height: auto; aspect-ratio: 630 / 560; }
    .card .text { width: auto; padding: 26px 24px; }
    .metrics { flex-direction: row; gap: 20px; margin-bottom: 0; }
    .metric { flex: 1; }
    .read-case { display: none; }
    .nda { margin-top: 20px; min-height: 0; padding: 0; border: 0; }
  }

  /* desktop: identity text block spacing */
  @media (min-width: 821px) {
    .identity .idtext { display: flex; flex-direction: column; }
  }
</style>
</head>

.tt td{ vertical-align:top; font-size:14.5px; line-height:20px; padding:16px 16px 8px 0; }
.sbar{ position:absolute; left:15px; top:342px; width:133px; height:5px; border-radius:3px; background:#dadade; }

/* chat list */
.cl{ position:absolute; left:28px; font-size:14.5px; line-height:20px; font-weight:500; white-space:nowrap; }
.hl{ position:absolute; left:16px; width:300px; height:36px; border-radius:10px; background:#f4f4f6; }
.cnt{ position:absolute; width:18px; height:18px; margin:-9px 0 0 -9px; border-radius:50%; background:#ffe1e4; color:#f04a5c; font-size:11px; font-weight:500; line-height:18px; text-align:center; }
.bbtn{ position:absolute; height:36px; border-radius:8px; background:#121214; color:#fff; font-size:15px; font-weight:500; display:flex; align-items:center; justify-content:center; gap:8px; }
.bbtn svg{ width:16px; height:16px; }

/* hero card */
.hero{ position:absolute; background:#fff; overflow:hidden; will-change:transform; z-index:4; }
.spw{ position:absolute; transform-style:preserve-3d; will-change:transform; z-index:7; }
.spw img{ backface-visibility:hidden; }
.hshadow{ box-shadow:0 30px 80px rgba(60,40,140,.14), 0 4px 14px rgba(60,40,140,.06); }
.wd{ position:absolute; left:50%; top:50%; width:430px; height:600px; margin:-300px 0 0 -215px; transform:scale(1.25581); transform-origin:50% 50%; background:linear-gradient(90deg,#fff 55%,#f9f9fa); }
.wd .title{ position:absolute; left:76px; top:28px; font-size:22px; line-height:28px; font-weight:700; letter-spacing:-.2px; }
.wd .line{ position:absolute; left:0; right:0; top:83px; height:1px; background:#efeff1; }
.circ{ position:absolute; width:36px; height:36px; margin:-18px 0 0 -18px; border-radius:50%; background:#f0f0f2; display:grid; place-items:center; color:#1d1d22; }
.circ svg{ width:18px; height:18px; }
.beta{ position:absolute; height:18px; padding:0 6px; border-radius:4px; background:#e4eaff; color:#5b7cf0; font-size:11px; font-weight:500; line-height:18px; }
.qchip{ position:absolute; top:402px; width:180px; height:66px; border-radius:12px; background:#f0f0f3; font-size:14px; line-height:17px; padding:16px 14px; white-space:nowrap; color:#1d1d23; }
.inbar{ position:absolute; left:0; right:0; top:520px; height:80px; background:#fff; border-radius:24px 24px 0 0; box-shadow:0 -6px 20px rgba(0,0,0,.045); }
.send{ position:absolute; border-radius:50%; background:#f0f0f2; display:grid; place-items:center; color:#a9a8b2; }

.inp{ position:absolute; left:50%; top:50%; width:950px; height:170px; margin:-85px 0 0 -475px; }
.inp .ph{ position:absolute; left:60px; top:50%; transform:translateY(-50%); font-size:34px; color:#a3a3ad; letter-spacing:-.2px; }
.glow{ z-index:3; position:absolute; left:305px; top:524px; width:950px; height:170px; border-radius:42px; opacity:0; }
.glow .blur{ position:absolute; inset:-10px; border-radius:52px; filter:blur(26px); }
.glow .ring{ position:absolute; inset:-3px; border-radius:43px; }
.sug{ position:absolute; left:305px; width:946px; height:84px; border-radius:24px; background:#fff; box-shadow:0 6px 20px rgba(60,50,110,.06), 0 1px 3px rgba(60,50,110,.04); display:flex; align-items:center; gap:21px; padding-left:20px; font-size:26px; color:#141418; opacity:0; }
.sug svg{ width:36px; height:36px; }
</style>

function bez(x1,y1,x2,y2){ const cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
  const X=t=>((ax*t+bx)*t+cx)*t, Y=t=>((ay*t+by)*t+cy)*t, dX=t=>(3*ax*t+2*bx)*t+cx;
  return p=>{ if(p<=0)return 0; if(p>=1)return 1; let t=p; for(let i=0;i<8;i++){ const d=dX(t); if(Math.abs(d)<1e-6)break; t-=(X(t)-p)/d; t=clamp(t);} return Y(t); }; }
const camE=bez(.45,0,.12,1), inE=bez(.16,1,.3,1), flE=bez(.4,0,.2,1), inQ=bez(.55,0,.75,.2);
const seg=(t,a,b,e=camE)=>e(clamp((t-a)/(b-a)));
const TAU=Math.PI*2;
const P='perspective(2400px) ';

/* ---------- chart ---------- */
const A0=[[20,178],[40,188],[60,206],[80,242],[100,280],[120,289],[141,297],[161,330],[181,350],[201,260],[221,160],[241,188],[261,300]];
const B0=[[20,212],[40,170],[60,140],[80,110],[100,90],[115,100],[141,305],[161,250],[181,86],[201,94],[221,130],[241,195],[261,352]];
function smooth(pts){ let d=`M${pts[0][0]} ${pts[0][1]}`; for(let i=0;i<pts.length-1;i++){ const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
  d+=` C${p1[0]+(p2[0]-p0[0])/6} ${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6} ${p2[1]-(p3[1]-p1[1])/6} ${p2[0]} ${p2[1]}`; } return d; }

/* ---------- blocks: final position centres (world) ---------- */
const HC=[793,691];   // hero widget centre
const BL={ bPick:[296,396], bChart:[306,1002], bTable:[1301,312], bList:[1287,1057] };
const order=['bPick','bTable','bChart','bList'];
const W=[523,315,540,753,28], I=[305,524,950,170,42];

/* ---------- sparkle: give each flat piece some thickness ---------- */
const SP=[['sp2',0,1],['sp1',1,.75],['sp3',2,.85]];
SP.forEach(([id])=>{
  const img=$(id), w=document.createElement('div');
  w.className='spw'; w.id=id+'w'; w.style.cssText=img.style.cssText;
  img.removeAttribute('id'); img.style.cssText='position:absolute;inset:0;width:100%;height:100%';
  img.parentNode.insertBefore(w,img);
  for(let k=7;k>=1;k--){ const c=img.cloneNode(); c.style.transform=`translateZ(${-k*3.2}px)`; c.style.filter=`brightness(${.62+.04*(7-k)}) contrast(1.05)`; w.appendChild(c); }
  w.appendChild(img); img.style.transform='translateZ(0.5px)'; img.classList.add('front');
});
const shadow=document.createElement('div'); shadow.id='spShadow';
shadow.style.cssText='position:absolute;left:560px;top:1040px;width:520px;height:60px;border-radius:50%;background:radial-gradient(closest-side, rgba(70,70,110,.22), rgba(70,70,110,0));';
$('world').insertBefore(shadow,$('world').firstChild);

/* smaller illustration: scale every piece toward the group centre */
const SPS=.72, G=[783,700];
const SPO=SP.map(([id])=>{ const e=$(id+'w'); const cx=parseFloat(e.style.left)+parseFloat(e.style.width)/2, cy=parseFloat(e.style.top)+parseFloat(e.style.height)/2; return [(G[0]+(cx-G[0])*SPS)-cx,(G[1]+(cy-G[1])*SPS)-cy]; });
const SHO=[(G[0]+(820-G[0])*SPS)-820,(G[1]+(1070-G[1])*SPS)-1070];
const blur=(px)=>px>0.05?`blur(${px.toFixed(2)}px)`:'none';

function render(t){
  t=((t%T)+T)%T;
  const w=TAU/T;

  /* scene 1 — sparkle floats; Apple-style exit (scale up + blur + fade) and return (settle in from blur) */
  const exitG=seg(t,0.6,1.05,inQ), backG=seg(t,6.8,7.75,camE);
  SP.forEach(([id,i,k])=>{
    const e=$(id+'w');
    const ex=seg(t,0.6+i*.04,1.05+i*.04,inQ);
    const bk=seg(t,6.8+i*.07,7.75+i*.07,camE);
    const vis=(t<1.2)?1-ex:(t>6.75?bk:0);
    const fy=Math.sin(w*2*t+i*1.9)*30*k;               // stronger float
    const ry=Math.sin(w*2*t+i*1.3)*16*k, rx=Math.cos(w*2*t+i*.8)*7;
    const sc=(t<4?1+.22*ex:.93+.07*bk)*SPS;
    const ty=t<4?0:(1-bk)*18;
    e.style.opacity=vis;
    e.style.filter=blur(t<4?ex*16:(1-bk)*9);
    e.style.transform=`perspective(1800px) translate(${SPO[i][0]}px,${SPO[i][1]}px) translateY(${(fy+ty)*SPS}px) rotateY(${ry}deg) rotateX(${rx}deg) scale(${sc})`;
    e.querySelector('.front').style.filter=`brightness(${1+.06*Math.sin(w*2*t+i*1.3+1)})`;
  });
  const sv=(t<1.2)?1-exitG:(t>6.75?backG:0);
  const lift=(Math.sin(w*2*t)+1)/2;
  shadow.style.opacity=sv*(.95-.35*lift);
  shadow.style.transform=`translate(${SHO[0]}px,${SHO[1]}px) scale(${(1.05-.18*lift)*SPS},${SPS})`;

  /* hero widget: Apple fade-in from blur, spin 360° into the input, fade out to blur */
  const pin=seg(t,0.75,1.5,inE);
  const spin=seg(t,3.85,5.45,bez(.45,0,.2,1));
  const out=seg(t,6.5,7.3,camE);
  const r=W.map((v,i)=>lerp(v,I[i],spin));
  const hero=$('hero');
  hero.style.left=r[0]+'px'; hero.style.top=r[1]+'px'; hero.style.width=r[2]+'px'; hero.style.height=r[3]+'px'; hero.style.borderRadius=r[4]+'px';
  const ang=360*spin;
  hero.style.transform=`perspective(2400px) rotateY(${ang}deg) scale(${(.9+.1*pin)*(1-.05*out)})`;
  hero.style.opacity=pin*(1-out);
  hero.style.filter=blur((1-pin)*12+out*12);
  $('wd').style.opacity=ang<90?1:0;
  $('inp').style.opacity=ang>270?1:0;

  /* glow around the input */
  const gl=seg(t,5.2,5.8,flE)*(1-seg(t,6.45,7.0,flE));
  $('glow').style.opacity=gl;
  $('glow').style.transform=`scale(${1-.05*out})`;
  const grad=`conic-gradient(from ${t*70}deg, #a855f7, #6366f1, #38bdf8, #f472b6, #fb923c, #a855f7)`;
  $('gblur').style.background=grad; $('gring').style.background=grad;
  $('gblur').style.opacity=.55+.25*Math.sin(t*2.4);

  /* suggestions drop out from under the input; leave with the input */
  for(let i=0;i<4;i++){ const e=$('s'+i);
    const dn=seg(t,5.4+i*.09,5.95+i*.09,inE);
    e.style.opacity=dn*(1-out);
    e.style.filter=blur(out*12);
    e.style.transform=`translateY(${-(1-dn)*40 + out*-10}px) scale(${(.97+.03*dn)*(1-.05*out)})`; }

  /* blocks: emerge from behind the widget, live, then fly ONTO it and dissolve */
  order.forEach((id,i)=>{
    const e=$(id), c=BL[id];
    const em=seg(t,1.05+i*.06,1.9+i*.06,inE);
    const fly=seg(t,3.45+i*.05,4.05+i*.05,bez(.55,0,.35,1));
    const dx=(HC[0]-c[0]), dy=(HC[1]-c[1]);
    let tx,ty,sc,op,bl,z;
    if(t<3.1){ tx=dx*(1-em)*.55; ty=dy*(1-em)*.55; sc=.7+.3*em; op=em; bl=(1-em)*10; z=2; }
    else { tx=dx*fly; ty=dy*fly; sc=1-.72*fly; op=1-seg(t,3.8+i*.05,4.1+i*.05,flE); bl=fly*4; z=6; }
    e.style.zIndex=z; e.style.opacity=op; e.style.filter=blur(bl);
    e.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;
  });

  /* chart: draws, then breathes up and down */
  const draw=seg(t,1.6,2.5,flE);
  const amp=seg(t,2.1,2.7,flE)*(1-seg(t,3.5,3.9,flE));
  const wob=(pts,ph,k)=>pts.map(([x,y],i)=>[x, clamp(y+Math.sin(t*2.2+i*.8+ph)*k*amp*(i%2?1:-1),40,366)]);
  $('lineA').setAttribute('d',smooth(wob(A0,0,13)));
  $('lineB').setAttribute('d',smooth(wob(B0,1.7,15)));
  const rv=$('reveal'); rv.style.display='block'; rv.setAttribute('x',20+241*draw); rv.setAttribute('width',Math.max(0,241*(1-draw)+20));

  /* table: scrolls sideways a little and back */
  const sc=seg(t,2.0,3.0);
  $('tt').style.transform=`translateX(${-200*sc}px)`;
  $('sbar').style.transform=`translateX(${130*sc}px)`;

  /* chat list: a single grey row that moves with the hover */
  const hy=56+40*seg(t,2.1,2.4)+40*seg(t,2.7,3.0);
  $('hov').style.top=hy+'px'; $('hov').style.opacity=1;
}

/* ---------- player ---------- */
const stage=$('stage'),frame=$('frame');
new ResizeObserver(()=>stage.style.transform=`scale(${frame.clientWidth/630})`).observe(frame);
const q=new URLSearchParams(location.search), reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let playing=!(q.has('t')||reduce), speed=1, cur=q.has('t')?parseFloat(q.get('t')):(reduce?6.2:0), last=performance.now();
const scrub=$('scrub'),timeEl=$('time'),pb=$('play');
function ui(){ scrub.value=cur.toFixed(2); timeEl.textContent=cur.toFixed(1)+' / '+T+' с'; pb.textContent=playing?'❚❚':'▶'; pb.setAttribute('aria-label',playing?'Пауза':'Играть'); }
function loop(now){ const dt=Math.min(.1,(now-last)/1000); last=now; if(playing) cur=(cur+dt*speed)%T; render(cur); ui(); requestAnimationFrame(loop); }
pb.onclick=()=>{ playing=!playing; };
scrub.oninput=()=>{ cur=parseFloat(scrub.value); playing=false; };
document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{ speed=parseFloat(b.dataset.speed); document.querySelectorAll('[data-speed]').forEach(x=>x.setAttribute('aria-pressed',x===b)); });
[['3D',0],['Блоки',0.6],['Поле ввода',3.4]].forEach(([n,ts])=>{ const b=document.createElement('button'); b.className='cb'; b.textContent=n; b.onclick=()=>{cur=ts;playing=true;}; $('scenes').appendChild(b); });
window.renderAt=t=>{ playing=false; cur=t; render(t); };
render(cur);
requestAnimationFrame(loop);
})();
</script>
<script>(function(){var f=document.getElementById('frame'),s=document.getElementById('stage');if(!f||!s)return;function fit(){var k=Math.max(f.clientWidth/630,f.clientHeight/560);s.style.transform='translate('+((f.clientWidth-630*k)/2)+'px,'+((f.clientHeight-560*k)/2)+'px) scale('+k+')';}try{new ResizeObserver(fit).observe(f);}catch(e){}addEventListener('resize',fit);setTimeout(fit,0);})();</scr'+'ipt>
</body>

<script>
  var I18N = {
    en: {
      title: 'Lead Product Designer',
      showCv: 'Show CV',
      bio: 'A product designer with 7+\u00A0years of experience. I work with big data, combining analytical thinking with creativity',
      experience: 'Experience',
      ph1: 'Ozon seller app — case visuals',

      case1M2: '60% of requests are for cabinet analytics, 30% for an information digest, and 8% are problem reports',
      readCase: 'Read case',
      case2Desc: 'Intuitive UX, real-time insights, and clean visual design to create a seamless Web3 experience. From portfolio tracking to NFT identity tools — every screen is built to feel simple and secure.',

    },
    ru: {

      experience: 'Опыт',
      ph1: 'Ozon для продавцов — визуал кейса',
      ph2: 'Chainstack wallet — визуал кейса',
      case1Title: 'AI-Помощник для продавцов',
      case1Sub: 'Работа над проектом в течение 2 лет с нуля. Начинали с бота по командам в мобильном приложении и закончили AI-режимом в веб-версии.',
      case1M1: 'MAU 50 тысяч пользователей, которые заходят в бота с периодичностью в среднем 1.2 дня',
      case1M2: '60% запросов пользователей за аналитическими данными кабинета, 30% приходят за информационной сводкой и 8% приходится на проблемы',

      nda: 'NDA, по запросу'
    }
  };

  var EXP = {
    en: [
      { company: 'Wildberries', role: 'Lead Product Designer', p1: 'now', p2: 'Mar 2026' },
      { company: 'Wildberries', role: 'Sr. Product Designer', p1: 'Jan 2026', p2: 'Jun 2024' },
      { company: 'Whitemark', role: 'UI/UX Designer', p1: 'May 2024', p2: 'Mar 2023' },
      { company: 'Startup', role: 'Product Designer', p1: 'Feb 2023', p2: 'May 2022' },
      { company: 'Vela', role: 'UI/UX Designer', p1: 'Apr 2022', p2: 'Feb 2020' }
    ],
    ru: [
      { company: 'Wildberries', role: 'Lead Product Designer', p1: 'сейчас', p2: 'март 2026' },
      { company: 'Wildberries', role: 'Sr. Product Designer', p1: 'январь 2026', p2: 'июнь 2024' },
      { company: 'Whitemark', role: 'UI/UX Designer', p1: 'май 2024', p2: 'март 2023' },
      { company: 'Стартап', role: 'Product Designer', p1: 'февраль 2023', p2: 'май 2022' },
      { company: 'Vela', role: 'UI/UX Designer', p1: 'апрель 2022', p2: 'февраль 2020' }
    ]
  };

  var lang = 'en', theme = 'dark';
  try { lang = localStorage.getItem('pf_lang') || 'en'; } catch (e) {}
  try { theme = localStorage.getItem('pf_theme') || 'dark'; } catch (e) {}

  function applyLang() {
    var dict = I18N[lang];
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      var k = el.getAttribute('data-i18n');
      if (dict[k] != null) el.textContent = dict[k];
    });
    document.documentElement.lang = lang;
    var list = document.getElementById('xp-list');
    list.innerHTML = '';
    EXP[lang].forEach(function (j) {
      var row = document.createElement('div'); row.className = 'job';
      var left = document.createElement('div');
      var c = document.createElement('div'); c.className = 'company'; c.textContent = j.company;
      var r = document.createElement('div'); r.className = 'role'; r.textContent = j.role;
      left.appendChild(c); left.appendChild(r);
      var d = document.createElement('div'); d.className = 'dates';
      var d1 = document.createElement('div'); d1.textContent = j.p1;
      var d2 = document.createElement('div'); d2.textContent = j.p2;
      d.appendChild(d1); d.appendChild(d2);
      row.appendChild(left); row.appendChild(d);
      list.appendChild(row);
    });
    document.querySelectorAll('[data-lang]').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-lang') === lang);
    });
  }

  function syncCoverTheme() {
    document.querySelectorAll('.coverframe').forEach(function (f) {
      try {
        if (f.contentDocument && f.contentDocument.documentElement) {
          f.contentDocument.documentElement.setAttribute('data-theme', theme);
        }
      } catch (e) {}
    });
  }
  function applyTheme() {
    document.documentElement.setAttribute('data-theme', theme);
    syncCoverTheme();
  }
  document.querySelectorAll('.coverframe').forEach(function (f) {
    f.addEventListener('load', syncCoverTheme);

  document.querySelectorAll('[data-lang]').forEach(function (b) {

      applyLang();
    });
  });
  document.querySelectorAll('.theme-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      theme = (theme === 'dark') ? 'light' : 'dark';
      try { localStorage.setItem('pf_theme', theme); } catch (e) {}
      applyTheme();
    });
  });

  applyTheme();
  applyLang();
</script>
